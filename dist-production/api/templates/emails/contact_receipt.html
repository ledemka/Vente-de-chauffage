<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <title></title>
  <!--[if mso]>
  <style>
    table {border-collapse:collapse;border-spacing:0;border:none;margin:0;}
    div, td {padding:0;}
    div {margin:0 !important;}
  </style>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style>
    table, td, div, h1, p {font-family: 'Chivo', Arial, sans-serif;}
    @media screen and (max-width: 600px) {
      .responsive-table {width: 100% !important;}
      .padding-mobile {padding: 20px !important;}
    }
  </style>
</head>
<body style="margin:0;padding:0;word-spacing:normal;background-color:#ece0da;">
  <div role="article" aria-roledescription="email" lang="fr" style="text-size-adjust:100%;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;background-color:#ece0da;">
    <table role="presentation" style="width:100%;border:none;border-spacing:0;">
      <tr>
        <td align="center" style="padding:40px 10px;">
          <table role="presentation" class="responsive-table" style="width:600px;max-width:600px;border:none;border-spacing:0;text-align:left;font-family:'Chivo', Arial, sans-serif;font-size:16px;line-height:22px;color:#201a17;background-color:#fff8f5;border-radius:8px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,0.05);">
            <tr>
              <td style="padding:40px;background-color:#802813;text-align:center;">
                <h1 style="margin:0;font-size:24px;font-weight:700;color:#ffffff;letter-spacing:1px;text-transform:uppercase;">sotramsbois</h1>
              </td>
            </tr>
            <tr>
              <td class="padding-mobile" style="padding:40px;">
                <h2 style="margin:0 0 20px 0;font-size:20px;color:#802813;">{{title}}</h2>
                <p style="margin:0 0 20px 0;">{{intro}}</p>
                <div style="background-color:#fef1eb;padding:20px;border-left:4px solid #802813;border-radius:4px;margin-bottom:20px;color:#56423d;font-style:italic;">
                  "{{message_summary}}"
                </div>
                <p style="margin:0 0 30px 0;font-size:15px;">{{delay_info}}</p>
                
                <table role="presentation" style="width:100%;border:none;border-spacing:0;margin-bottom:30px;">
                  <tr>
                    <td align="center">
                      <a href="{{app_url}}" style="background-color:#802813;color:#ffffff;text-decoration:none;padding:14px 24px;border-radius:4px;font-weight:bold;display:inline-block;">{{cta_home}}</a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:30px;background-color:#201a17;color:#fff8f5;text-align:center;font-size:14px;">
                <p style="margin:0 0 10px 0;">&copy; {{year}} sotramsbois. Tous droits réservés.</p>
                <p style="margin:0;"><a href="{{app_url}}/contact.html" style="color:#ffb4a3;text-decoration:underline;">Nous contacter</a> | <a href="{{app_url}}/mentions-legales.html" style="color:#ffb4a3;text-decoration:underline;">Mentions légales</a></p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
